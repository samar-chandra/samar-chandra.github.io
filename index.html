<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: white;
      padding: 60px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #666;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      padding: 12px 24px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Hello 👋</h1>

    <p>
      Welcome to my website.
    </p>

    <a href="https://github.com/" target="_blank">
      My GitHub
    </a>
  </div>

</body>
</html>
